<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Queeks</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

    <link 
        rel="stylesheet"
        href="{{ url_for('static', filename='css/quiz.css') }}"
    >
</head>
<body>
    <main class="results-page">
        <header class="quiz-header">
            <a href="/" class="logo">queeks</a>
            <span>Results</span>
        </header>
        <section class="results">
            <p class="eyebrow">QUIZ COMPLETE</p>
            <h1 id="score">- / -</h1>
            <p id="result-message">
                Your results are ready.
            </p>
            <div class="result-stats">
                <p>
                    Correct:
                    <strong id="correct-count">0</strong>
                </p>

                <p>
                    Wrong:
                    <strong id="wrong-count">0</strong>
                </p>
            </div>
            
            <div class="result-actions">
                <a href="/quiz" class="start-button">
                    Try again
                </a>

                <a href="/topics" class="secondary-button">
                    Back to topics
                </a>

            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/quiz/quiz_results.js') }}"></script>

</body>

</html>
